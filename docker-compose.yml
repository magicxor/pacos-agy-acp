services:
  pacos:
    image: ${DOCKER_REGISTRY-}pacos
    build:
      context: .
      dockerfile: Pacos/Dockerfile
    environment:
      # Shared crawl4ai bearer token. Must match the crawl4ai service's CRAWL4AI_API_TOKEN
      # (both interpolate the same variable) so the Crawl4AiMcp server can authenticate. The
      # local default keeps dev working with no setup; override by exporting CRAWL4AI_API_TOKEN.
      - Pacos__Crawl4AiApiToken=${CRAWL4AI_API_TOKEN:-dev-local-crawl4ai-token}
    depends_on:
      gallerydl-webapi:
        condition: service_started
      crawl4ai:
        condition: service_started
      quickchart:
        condition: service_started
      movieadvisor-api:
        condition: service_started
      # agy connects to its MCP servers when a chat session starts, so a sidecar that is still
      # installing at that moment is simply missing from that session's tool list. Wait until it
      # actually lists its tools (see its healthcheck); required: false keeps the bot startable if
      # the sidecar never gets healthy (PyPI unreachable on a cold cache) - compose warns instead.
      websearch-mcp:
        condition: service_healthy
        required: false

  # gallery-dl backend for the GalleryDl MCP server (spawned by agy inside the
  # pacos container). Same wiring as production: http://gallerydl-webapi:8080.
  gallerydl-webapi:
    image: ghcr.io/magicxor/gallerydl-webapi:0.3.1

  # QuickChart chart-rendering backend, used by the bot from inside the pacos
  # container. Same wiring as production: http://quickchart:3400. The magicxor
  # fork (Chart.js 4 + built-in geo maps), not the upstream ianw image.
  quickchart:
    image: ghcr.io/magicxor/quickchart:2.0.7

  # Crawl4AI backend for the custom MCP server (spawned by agy inside
  # the pacos container). Same wiring as production: http://crawl4ai:11235.
  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    shm_size: 1gb
    environment:
      # Without a token crawl4ai 0.9.x binds to 127.0.0.1 only and is unreachable from the
      # pacos container (Connection refused). Setting a token makes it bind 0.0.0.0 and requires
      # the same bearer token on every call — the pacos service passes the same value to the MCP.
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-dev-local-crawl4ai-token}

  # MovieAdvisor REST API backend for the movieadvisor MCP server (spawned by agy inside the
  # pacos container). Same wiring as production: http://movieadvisor-api:8080. The named volume
  # holds its SQLite database - the per-chat history of which releases a chat has already been
  # offered - so restarting the stack does not make everything look new again.
  movieadvisor-api:
    image: ghcr.io/magicxor/movieadvisor-api:0.0.0-alpha.4
    volumes:
      - movieadvisor-state:/data

  # web-search-plus-mcp: one web_search/web_extract tool pair over several search providers
  # with automatic failover. Unlike the other MCP servers it is NOT spawned by agy: the package
  # is stdio-only, so mcp-proxy bridges it to Streamable HTTP and agy connects to
  # http://websearch-mcp:8000/mcp (the "websearch" serverUrl entry in PacosOptions.McpServers).
  # Same wiring as production; see docker-compose.deploy.yml for why mcp-proxy and not
  # supergateway. Provider keys come from the environment - put them in a git-ignored .env next
  # to this file; every key is optional and a provider without one is simply skipped. The
  # provider order is websearch-mcp.config.json.
  websearch-mcp:
    image: ghcr.io/astral-sh/uv:0.9.30-python3.13-bookworm-slim
    command:
      - uvx
      - --from
      - mcp-proxy==0.12.0
      - --with
      - mcp<2
      - mcp-proxy
      - --port
      - "8000"
      - --host
      - 0.0.0.0
      - --stateless
      - --pass-environment
      - --
      - uvx
      - web-search-plus-mcp==4.1.1
      - serve
    environment:
      - WEB_SEARCH_PLUS_CONFIG=/config/config.json
      - EXA_API_KEY=${EXA_API_KEY:-}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LINKUP_API_KEY=${LINKUP_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
    volumes:
      - ./websearch-mcp.config.json:/config/config.json:ro
      # uvx resolves both pinned packages on every container start; the cache keeps that off PyPI.
      - websearch-uv-cache:/root/.cache/uv
    healthcheck:
      # Healthy = the aggregator answers tools/list with web_search, not just "port open". The
      # image has neither curl nor wget, hence python.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request as u
          body = b'{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
          req = u.Request("http://localhost:8000/mcp", data=body, headers={"Content-Type": "application/json", "Accept": "application/json, text/event-stream"})
          sys.exit(0 if b"web_search" in u.urlopen(req, timeout=10).read() else 1)
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 120s
volumes:
  movieadvisor-state:
  websearch-uv-cache:
